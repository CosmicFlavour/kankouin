[package]
name = "kankouin"
version = "1.2.0"
description = "Kankouin — personal task manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kankouin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Direct (not just transitive-via-tauri-plugin-notification) — see
# commands::notify's doc comment for why the plugin's own send path can't
# be used as-is on Linux.
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
aes-gcm = "0.10"
argon2 = "0.5"
ureq = { version = "2", features = ["json"] }
# Direct (not just transitive-via-ureq) because the AI provider builds its own
# `rustls::ClientConfig` when a connection configures a custom CA certificate.
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Generates a throwaway CA + server certificate for the custom-CA TLS
# round-trip test in ai::openwebui — never used outside `#[cfg(test)]`.
rcgen = "0.13"

